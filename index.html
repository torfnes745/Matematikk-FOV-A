<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppgaver: Areal og Omkrets</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --shape-bg: #e0e7ff;
            --shape-border: #0f172a;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 1.75rem;
        }

        .module-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn-mod {
            flex: 1;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-mod.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .task-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
        }

        /* Hovedområde for visning av figur */
        .display-area {
            width: 100%;
            height: 340px;
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            position: relative;
            box-sizing: border-box;
        }

        /* --- CSS FIGURER --- */
        .shape-rectangle {
            position: absolute;
            background-color: var(--shape-bg);
            border: 3px solid var(--shape-border);
            box-sizing: border-box;
        }

        .shape-triangle {
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
            box-sizing: border-box;
        }

        /* Sammensatt figur bygget opp av to CSS-blokker, men UTEN skillelinje */
        .composite-wrapper {
            position: absolute;
            box-sizing: border-box;
        }
        .comp-main {
            position: absolute;
            background-color: var(--shape-bg);
            border: 3px solid var(--shape-border);
            box-sizing: border-box;
        }
        .comp-sub {
            position: absolute;
            background-color: var(--shape-bg);
            box-sizing: border-box;
        }

        /* --- TEKSTPLASSERING --- */
        .measure-text {
            position: absolute;
            font-weight: bold;
            font-size: 15px;
            color: var(--text);
            white-space: nowrap;
        }

        /* --- SKJEMA & INPUT --- */
        .inputs-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .feedback {
            font-weight: bold;
            font-size: 1.1rem;
            display: none;
            padding: 0.8rem;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .correct { color: var(--success); background: #f0fdf4; }
        .wrong { color: var(--danger); background: #fef2f2; }

        .action-btns {
            display: flex;
            gap: 1rem;
            width: 100%;
            margin-top: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #e2e8f0; color: var(--text); }
        .btn-secondary:hover { background: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">
    <h1>Matematikkoppgaver</h1>
    
    <div class="module-selector">
        <button class="btn-mod active" id="mod2-btn" onclick="setModule(2)">Modul 2</button>
        <button class="btn-mod" id="mod3-btn" onclick="setModule(3)">Modul 3</button>
    </div>

    <div class="task-card">
        <h3>Regn ut areal og omkrets av figuren:</h3>
        
        <!-- Her blir HTML-figurene dyttet rett inn -->
        <div id="display-area" class="display-area"></div>

        <div class="inputs-container">
            <div class="input-group">
                <label for="ans-area">Hva er arealet? (cm²)</label>
                <input type="number" id="ans-area" placeholder="Tast inn areal">
            </div>
            <div class="input-group">
                <label for="ans-perim">Hva er omkretsen? (cm)</label>
                <input type="number" id="ans-perim" placeholder="Tast inn omkrets">
            </div>
        </div>

        <div id="feedback" class="feedback"></div>

        <div class="action-btns">
            <button class="btn btn-secondary" onclick="generateTask()">Ny oppgave</button>
            <button class="btn btn-primary" onclick="checkAnswer()">Sjekk svar</button>
        </div>
    </div>
</div>

<script>
    let currentModule = 2;
    let currentTask = {};

    function setModule(mod) {
        currentModule = mod;
        document.getElementById('mod2-btn').classList.toggle('active', mod === 2);
        document.getElementById('mod3-btn').classList.toggle('active', mod === 3);
        generateTask();
    }

    function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateTask() {
        document.getElementById('ans-area').value = '';
        document.getElementById('ans-perim').value = '';
        document.getElementById('feedback').style.display = 'none';

        if (currentModule === 2) {
            const isRectangle = Math.random() > 0.5;
            if (isRectangle) {
                const b = rand(5, 12);
                const h = rand(4, 8);
                currentTask = {
                    type: 'rectangle',
                    b: b, h: h,
                    area: b * h,
                    perimeter: 2 * (b + h)
                };
            } else {
                const triples = [
                    {b: 3, h: 4, hyp: 5},
                    {b: 6, h: 8, hyp: 10},
                    {b: 5, h: 12, hyp: 13}
                ];
                const triple = triples[rand(0, triples.length - 1)];
                const swap = Math.random() > 0.5;
                const finalB = swap ? triple.h : triple.b;
                const finalH = swap ? triple.b : triple.h;

                currentTask = {
                    type: 'triangle',
                    b: finalB, h: finalH, hyp: triple.hyp,
                    area: (finalB * finalH) / 2,
                    perimeter: finalB + finalH + triple.hyp
                };
            }
        } else {
            // Modul 3: Sammensatt L-figur
            const totalW = rand(9, 13);
            const totalH = rand(9, 12);
            const cutW = rand(4, totalW - 4);
            const cutH = rand(4, totalH - 4);

            const sideA = totalH;            
            const sideB = totalW;            
            const sideC = totalH - cutH;     
            const sideD = cutW;              
            const sideE = cutH;              
            const sideF = totalW - cutW;     

            currentTask = {
                type: 'composite-l',
                totalW, totalH, cutW, cutH,
                sides: { A: sideA, B: sideB, C: sideC, D: sideD, E: sideE, F: sideF },
                area: (totalW * totalH) - (cutW * cutH),
                perimeter: totalW + totalH + sideC + sideD + sideE + sideF
            };
        }

        renderHTMLShape();
    }

    function renderHTMLShape() {
        const target = document.getElementById('display-area');
        target.innerHTML = ''; // Tømmer skjermen
        
        const scale = 16; 
        const startX = 110;
        const startY = 70;

        if (currentTask.type === 'rectangle') {
            const w = currentTask.b * scale;
            const h = currentTask.h * scale;

            target.innerHTML = `
                <div class="shape-rectangle" style="left:${startX}px; top:${startY}px; width:${w}px; height:${h}px;"></div>
                <div class="measure-text" style="left:${startX + w/2 - 15}px; top:${startY + h + 10}px;">${currentTask.b} cm</div>
                <div class="measure-text" style="left:${startX - 50}px; top:${startY + h/2 - 10}px;">${currentTask.h} cm</div>
            `;
        } 
        else if (currentTask.type === 'triangle') {
            const w = currentTask.b * scale;
