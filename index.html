<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mattemoro: Areal og Omkrets</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            background: white;
            margin: 0 auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .oppgave-tekst {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2980b9;
            margin: 20px 0;
            min-height: 40px;
        }
        canvas {
            background: #fafafa;
            border: 2px dashed #ccc;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .input-felt {
            font-size: 1.2rem;
            padding: 10px;
            width: 120px;
            text-align: center;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
        }
        .input-felt:focus {
            border-color: #3498db;
        }
        button {
            font-size: 1.2rem;
            padding: 10px 25px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #27ae60;
        }
        .tilbakemelding {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 20px;
            min-height: 30px;
        }
        .riktig { color: #27ae60; }
        .feil { color: #c0392b; }
        .neste-knapp {
            background-color: #3498db;
        }
        .neste-knapp:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📐 Mattemoro!</h1>
    <p>Regn ut svaret og skriv det inn i boksen.</p>
    
    <div class="oppgave-tekst" id="oppgaveTekst">Laster oppgave...</div>
    
    <canvas id="figurCanvas" width="400" height="300"></canvas>
    
    <div id="svarSeksjon">
        <input type="number" step="any" id="brukerSvar" class="input-felt" placeholder="Svar..." autocomplete="off">
        <span id="enhetTekst" style="font-size: 1.2rem; font-weight: bold; margin-left: 5px;">cm</span>
        <button id="sjekkKnapp" onclick="sjekkSvar()">Sjekk svar</button>
        <button id="nesteKnapp" class="neste-knapp" onclick="nyOppgave()" style="display: none;">Neste oppgave ➡️</button>
    </div>
    
    <div class="tilbakemelding" id="tilbakemelding"></div>
</div>

<script>
    const canvas = document.getElementById('figurCanvas');
    const ctx = canvas.getContext('2d');
    
    let gjeldendeOppgave = {};

    // Lytter etter 'Enter'-tast i inputfeltet
    document.getElementById('brukerSvar').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            if (document.getElementById('sjekkKnapp').style.display !== 'none') {
                sjekkSvar();
            } else {
                nyOppgave();
            }
        }
    });

    function tilfeldigHeltall(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function nyOppgave() {
        // Nullstill grensesnitt
        document.getElementById('brukerSvar').value = '';
        document.getElementById('brukerSvar').disabled = false;
        document.getElementById('tilbakemelding').innerHTML = '';
        document.getElementById('sjekkKnapp').style.display = 'inline-block';
        document.getElementById('nesteKnapp').style.display = 'none';
        
        // Rens canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Velg type figur og oppgave
        const figurType = Math.random() > 0.5 ? 'rektangel' : 'trekant';
        const oppgaveType = Math.random() > 0.5 ? 'areal' : 'omkrets';
        
        if (figurType === 'rektangel') {
            const b = tilfeldigHeltall(4, 12);
            const h = tilfeldigHeltall(3, 8);
            
            const fasit = (oppgaveType === 'areal') ? (b * h) : (2 * (b + h));
            
            gjeldendeOppgave = { type: oppgaveType, fasit: fasit };
            tegnRektangel(b, h, oppgaveType);
            
        } else {
            const g = tilfeldigHeltall(5, 12);
            const h = tilfeldigHeltall(4, 9);
            // Pytagoras for hypotenus, rund av til 1 desimal
            const hyp = Math.round(Math.sqrt(g*g + h*h) * 10) / 10;
            
            let fasit;
            if (oppgaveType === 'areal') {
                fasit = (g * h) / 2;
            } else {
                fasit = Math.round((g + h + hyp) * 10) / 10;
            }
            
            gjeldendeOppgave = { type: oppgaveType, fasit: fasit };
            tegnTrekant(g, h, hyp, oppgaveType);
        }
        
        // Oppdater tekst og enhet
        document.getElementById('oppgaveTekst').innerText = `Hva er ${oppgaveType}et til denne figuren?`;
        document.getElementById('enhetTekst').innerText = (oppgaveType === 'areal') ? 'cm²' : 'cm';
        document.getElementById('brukerSvar').focus();
    }

    function tegnRektangel(b, h, oppgaveType) {
        // Skaleringsfaktor for å passe på skjermen
        const skala = 20;
        const w = b * skala;
        const o = h * skala;
        
        // Sentrer figuren på canvaset
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - o) / 2;
        
        // Tegn formen
        ctx.fillStyle = '#add8e6';
        ctx.fillRect(x, y, w, o);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#2c3e50';
        ctx.strokeRect(x, y, w, o);
        
        // Tekstmål
        ctx.fillStyle = '#000';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        
        // Bredde (bunn)
        ctx.fillText(`${b} cm`, x + w/2, y + o + 25);
        // Høyde (venstre side)
        ctx.save();
        ctx.translate(x - 15, y + o/2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText(`${h} cm`, 0, 0);
        ctx.restore();
    }

    function tegnTrekant(g, h, hyp, oppgaveType) {
        const skala = 20;
        const w = g * skala;
        const o = h * skala;
        
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - o) / 2;
        
        // Tegn formen (rettvinklet trekant)
        ctx.fillStyle = '#90ee90';
        ctx.beginPath();
        ctx.moveTo(x, y + o);         // Venstre bunnhjørne
        ctx.lineTo(x + w, y + o);     // Høyre bunnhjørne
        ctx.lineTo(x, y);             // Topphjørne
        ctx.closePath();
        ctx.fill();
        
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#2c3e50';
        ctx.stroke();
        
        // Tekstmål
        ctx.fillStyle = '#000';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        
        // Grunnlinje (bunn)
        ctx.fillText(`${g} cm`, x + w/2, y + o + 25);
        // Høyde (venstre side)
        ctx.save();
        ctx.translate(x - 15, y + o/2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText(`${h} cm`, 0, 0);
        ctx.restore();
        
        // Hypotenus (vises kun hvis oppgaven ber om omkrets)
        if (oppgaveType === 'omkrets') {
            ctx.save();
            ctx.translate(x + w/2 + 15, y + o/2 - 15);
            // Beregn vinkel for teksten langs skrålinjen
            const vinkel = Math.atan2(-o, w);
            ctx.rotate(vinkel);
            ctx.fillText(`${hyp} cm`, 0, 0);
            ctx.restore();
        }
    }

    function sjekkSvar() {
        const input = document.getElementById('brukerSvar').value.trim().replace(',', '.');
        if (input === "") return;
        
        const brukerSvar = parseFloat(input);
        const tilbakemeldingEft = document.getElementById('tilbakemelding');
        
        // Tillat et bittelite avvik pga. desimalavrunding i omkrets
        if (Math.abs(brukerSvar - gjeldendeOppgave.fasit) < 0.15) {
            tilbakemeldingEft.innerHTML = "<span class='riktig'>🎉 Riktig svar! Supert jobba! 🌟</span>";
            document.getElementById('brukerSvar').disabled = true;
            document.getElementById('sjekkKnapp').style.display = 'none';
            document.getElementById('nesteKnapp').style.display = 'inline-block';
        } else {
            tilbakemeldingEft.innerHTML = `<span class='feil'>❌ Nei, det var ikke helt riktig. Prøv igjen!</span>`;
        }
    }

    // Start første oppgave automatisk
    nyOppgave();
</script>

</body>
</html>
