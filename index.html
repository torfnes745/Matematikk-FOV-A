<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppgaver: Areal og Omkrets</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 1.75rem;
        }

        .module-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn-mod {
            flex: 1;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-mod.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .task-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        canvas {
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            max-width: 100%;
        }

        .inputs-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .input-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        input[type="number"] {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
        }

        .feedback {
            font-weight: bold;
            font-size: 1.1rem;
            display: none;
            padding: 0.5rem;
            border-radius: 6px;
            text-align: center;
            width: 100%;
        }

        .correct { color: var(--success); background: #f0fdf4; }
        .wrong { color: var(--danger); background: #fef2f2; }

        .action-btns {
            display: flex;
            gap: 1rem;
            width: 100%;
            margin-top: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #e2e8f0; color: var(--text); }
        .btn-secondary:hover { background: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">
    <h1>Matematikkoppgaver</h1>
    
    <!-- Nivåvelger -->
    <div class="module-selector">
        <button class="btn-mod active" id="mod2-btn" onclick="setModule(2)">Modul 2</button>
        <button class="btn-mod" id="mod3-btn" onclick="setModule(3)">Modul 3</button>
    </div>

    <!-- Oppgaveområde -->
    <div class="task-card">
        <h3 id="task-text">Regn ut areal og omkrets av figuren nedenfor:</h3>
        
        <!-- Her tegnes figuren -->
        <canvas id="canvas" width="400" height="320"></canvas>

        <!-- Svarfelter -->
        <div class="inputs-container">
            <div class="input-group">
                <label for="ans-area">Hva er arealet? (cm²)</label>
                <div class="input-row">
                    <input type="number" id="ans-area" placeholder="Areal">
                </div>
            </div>
            <div class="input-group">
                <label for="ans-perim">Hva er omkretsen? (cm)</label>
                <div class="input-row">
                    <input type="number" id="ans-perim" placeholder="Omkrets">
                </div>
            </div>
        </div>

        <!-- Tilbakemelding -->
        <div id="feedback" class="feedback"></div>

        <!-- Knapper -->
        <div class="action-btns">
            <button class="btn btn-secondary" onclick="generateTask()">Ny oppgave</button>
            <button class="btn btn-primary" onclick="checkAnswer()">Sjekk svar</button>
        </div>
    </div>
</div>

<script>
    let currentModule = 2;
    let currentTask = {};
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function setModule(mod) {
        currentModule = mod;
        document.getElementById('mod2-btn').classList.toggle('active', mod === 2);
        document.getElementById('mod3-btn').classList.toggle('active', mod === 3);
        generateTask();
    }

    function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateTask() {
        document.getElementById('ans-area').value = '';
        document.getElementById('ans-perim').value = '';
        const feedback = document.getElementById('feedback');
        feedback.style.display = 'none';
        feedback.className = 'feedback';

        if (currentModule === 2) {
            const isRectangle = Math.random() > 0.5;
            if (isRectangle) {
                const b = rand(4, 12);
                const h = rand(3, 8);
                currentTask = {
                    type: 'rectangle',
                    b: b, h: h,
                    area: b * h,
                    perimeter: 2 * (b + h)
                };
            } else {
                // Her er listen over pytagoreiske tripler rettet opp!
                const triples = [
                    {b: 3, h: 4, hyp: 5},
                    {b: 6, h: 8, hyp: 10},
                    {b: 5, h: 12, hyp: 13}
                ];
                const triple = triples[rand(0, triples.length - 1)];
                
                // Tilfeldig om vi bytter om grunnlinje og høyde for variasjon
                const swap = Math.random() > 0.5;
                const finalB = swap ? triple.h : triple.b;
                const finalH = swap ? triple.b : triple.h;

                currentTask = {
                    type: 'triangle',
                    b: finalB, h: finalH, hyp: triple.hyp,
                    area: (finalB * finalH) / 2,
                    perimeter: finalB + finalH + triple.hyp
                };
            }
        } else {
            // Modul 3: Sammensatt figur (L-form) uten skillelinjer
            const totalW = rand(8, 12);
            const totalH = rand(8, 11);
            const cutW = rand(3, totalW - 3);
            const cutH = rand(3, totalH - 3);

            const sideA = totalH;            
            const sideB = totalW;            
            const sideC = totalH - cutH;     
            const sideD = cutW;              
            const sideE = cutH;              
            const sideF = totalW - cutW;     

            const area = (totalW * totalH) - (cutW * cutH);
            const perimeter = totalW + totalH + sideC + sideD + sideE + sideF;

            currentTask = {
                type: 'composite-l',
                totalW, totalH, cutW, cutH,
                sides: { A: sideA, B: sideB, C: sideC, D: sideD, E: sideE, F: sideF },
                area: area,
                perimeter: perimeter
            };
        }

        drawShape();
    }

    function drawShape() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#0f172a';
        ctx.fillStyle = '#e0e7ff';
        ctx.font = 'bold 15px sans-serif';

        const startX = 90;
        const startY = 60;
        const scale = 20; 

        if (currentTask.type === 'rectangle') {
            const w = currentTask.b * scale;
            const h = currentTask.h * scale;
            
            ctx.beginPath();
            ctx.rect(startX, startY, w, h);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#0f172a';
            ctx.fillText(`${currentTask.b} cm`, startX + w/2 - 15, startY + h + 25); 
            ctx.fillText(`${currentTask.h} cm`, startX - 45, startY + h/2 + 5);      
        } 
        else if (currentTask.type === 'triangle') {
            const w = currentTask.b * scale;
            const h = currentTask.h * scale;

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(startX, startY + h); 
            ctx.lineTo(startX + w, startY + h); 
            ctx.closePath(); 
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#0f172a';
            ctx.fillText(`${currentTask.h} cm`, startX - 45, startY + h/2 + 5); 
            ctx.fillText(`${currentTask.b} cm`, startX + w/2 - 15, startY + h + 25); 
            ctx.fillText(`${currentTask.hyp} cm`, startX + w/2 + 10, startY + h/2 - 10); 
        } 
        else if (currentTask.type === 'composite-l') {
            const tW = currentTask.totalW * scale;
            const tH = currentTask.totalH * scale;
